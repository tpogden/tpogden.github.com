name: ogden-eu
# Legacy conda environment; the site itself is built with uv (see pyproject.toml).
# The posts' figures were produced with older MaxwellBloch releases; clerq >= 0.13
# fixed a factor of 2 in the propagation equation, so re-running them gives
# different optical depths.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib=3
  - seaborn
  - ffmpeg
  - pip
  - pip:
    - clerq
